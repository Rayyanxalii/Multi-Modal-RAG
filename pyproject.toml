[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rayyan", email = "alirayyan986@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.140.0",
    "gradio>=6.31.0",
    "langchain>=1.4.6",
    "llama-index>=0.14.25",
    "llama-index-llms-groq>=0.6.1",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "ollama>=0.6.3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers[image]>=6.0.0",
]

[project.scripts]
rag = "rag.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]
